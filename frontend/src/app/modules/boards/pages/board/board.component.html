
<div
  class="flex w-full grow bg-cover bg-center h-full overflow-y-auto"
  [ngClass]="getBoardBackgroundClass()"
>
  <div>
    <!-- SideMenu lateral -->
    <aside class="w-64 h-full bg-gray-800/60">
      <button type="button" class="w-full  flex justify-between align-center py-2 px-3">
        <div
          class="flex items-center cursor-pointer h-20"
        >
          <img
            class="w-10 h-10 rounded-lg mx-2"
            [src]="user?.avatar"
            alt=""
          />
          <div class="w-3/4 text-left text-sm block p-2 text-white">
            Workspace from {{ user?.name }}
          </div>
          <fa-icon [icon]="faAngleRight" class="text-white"></fa-icon>
        </div>
      </button>

      <hr class="border-spacing-0 border-gray-300" />

      <ul class="flex flex-col font-normal text-white text-base py-3">
        <li class="hover:bg-white/40 cursor-pointer">
          <a class="block py-2 px-5"
            ><fa-icon [icon]="faTrello" class="mr-3.5"></fa-icon> Dashboards</a
          >
        </li>
        <li class="hover:bg-white/40 cursor-pointer">
          <a class="flex justify-between py-2 px-5">
            <div>
              <fa-icon [icon]="faUsers" class="mr-2"></fa-icon> Members
            </div>
            <div>
              <fa-icon [icon]="faPlus"></fa-icon>
            </div>
          </a>
        </li>
        <li class="hover:bg-white/40 cursor-pointer">
          <a class="flex justify-between py-2 px-5">
            <div>
              <fa-icon [icon]="faGear" class="mr-3"></fa-icon> Space Settings
            </div>
            <div>
              <fa-icon [icon]="faAngleDown"></fa-icon>
            </div>
          </a>
        </li>
      </ul>

      <h2 class="text-left text-base font-bold block px-5 text-white">
        Workspace Views
      </h2>

      <ul class="flex flex-col font-normal text-white text-base py-3">
        <li class="hover:bg-white/40 cursor-pointer">
          <a class="block py-2 px-5"
            ><fa-icon [icon]="faTableList" class="mr-3.5"></fa-icon> Table</a
          >
        </li>
        <li class="hover:bg-white/40 cursor-pointer">
          <a class="block py-2 px-5"
            ><fa-icon [icon]="faCalendarDays" class="mr-3.5"></fa-icon> Calendar</a
          >
        </li>
      </ul>

      <div class="flex justify-between py-2 px-5">
        <div>
          <h2 class="text-left text-base font-bold block text-white">
            Sus tableros
          </h2>
        </div>
        <div class="text-white">
          <fa-icon [icon]="faPlus"></fa-icon>
        </div>
      </div>

      <ul class="flex flex-col font-normal text-white text-base">
        <li class="hover:bg-white/40 cursor-pointer">
          <a class="flex py-2 px-5">
            <img
              class="w-8 h-8 rounded-lg mr-3"
              [src]="user?.avatar"
              alt=""
            />
            ¡Welcome to Trello!
          </a>
        </li>
      </ul>


    </aside>
    <!-- FIN SideMenu lateral -->
  </div>

  <!-- Columna contenido -->
  <div class="flex-1">
    <!-- This is the header of the board -->
    <div class="flex w-full bg-black/30 px-4 py-2">

        <div class="flex align-center justify-center px-4 py-2 text-white">
          <h2 class="text-xl font-bold pr-5">
            {{ board?.title }}
          </h2>
          <fa-icon [icon]="faStar" class="mt-1"></fa-icon>
        </div>
        <button class="flex align-center justify-center mx-2 px-4 py-2 text-white rounded-md hover:bg-gray-50/10 cursor-pointer">
          <fa-icon [icon]="faLock" class="mt-1"></fa-icon>
          <h2 class="text-lg font-semibold pl-2">
            Private
          </h2>
        </button>
        <button class="flex align-center justify-center px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-white cursor-pointer">
          <fa-icon [icon]="faTrello" class="mt-1"></fa-icon>
          <h2 class="text-lg font-semibold pl-2">
            Dashboard
          </h2>
        </button>
        <button class="flex align-center justify-center mx-2 px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-white cursor-pointer">
          <fa-icon [icon]="faAngleDown" class="mt-1"></fa-icon>
        </button>
    </div>

    <!-- Contenido de las listas -->
    <!-- Wrapper for scrolling -> overflow-x-auto-->
    <!-- This ensures that the scroll behavior is applied to the entire board section instead of just the columns. -->
    <!-- flex: This makes sure the board takes the available space dynamically while allowing scrolling only when needed -->
    <!-- cdkDropList is a directive that allows you to create a drop zone for drag-and-drop functionality.
    cdkDropListOrientation="horizontal" is to make the lists horizontal -->
    <!-- cdkDropListDropped is an event and hence I need to create dropList(event)
    [cdkDropListData] contains the data to sort the column again, in this case the data is the array
    called 'list?.card'-->
    <!-- cdkDropListGroup is a directive that allows you to create a group of drop zones for drag-and-drop functionality. -->
    <div
    cdkDropList
    cdkDropListOrientation="horizontal"
    [cdkDropListData]="board?.lists || []"
    (cdkDropListDropped)="dropList($event)"
    class="flex items-start w-full px-4 pb-4 mt-4 overflow-x-auto"
    >
      <!-- Lists -->
      <div
        *ngFor="let list of board?.lists"
        cdkDrag
        class="rounded-2xl bg-gray-200 w-72 p-2 mr-3 shrink-0"
      >
        <!-- List header with edit/delete functionality -->
        <div class="flex justify-between py-1">
          <!-- List title (view mode) -->
          <h3
            *ngIf="editingListId !== list.id"
            class="text-sm font-semibold ml-2 cursor-pointer"
            (click)="editListTitle(list)"
          >
            {{ list.title }}
          </h3>

          <!-- List title (edit mode) -->
          <div *ngIf="editingListId === list.id" class="w-full ml-2">
            <input
              type="text"
              [id]="'list-title-' + list.id"
              class="w-full text-sm font-semibold rounded border border-blue-500 px-2 py-1 focus:outline-none"
              [(ngModel)]="editedListTitle"
              (keydown.enter)="saveListTitle(list)"
              (keydown.escape)="cancelListEdit()"
              (blur)="saveListTitle(list)"
            />
          </div>

          <!-- List actions dropdown -->
          <div class="relative">
            <button
              class="text-gray-600 hover:text-gray-800 mr-2 px-1"
              (click)="toggleListActions(list)"
            >
              •••
            </button>

            <!-- Dropdown menu -->
            <div
              *ngIf="isListActionsVisible(list)"
              class="absolute right-0 top-6 bg-white rounded shadow-lg z-10 w-48"
            >
              <ul class="py-1">
                <li>
                  <button
                    class="w-full text-left px-4 py-2 hover:bg-gray-100"
                    (click)="editListTitle(list); list.showActions = false;"
                  >
                    <fa-icon [icon]="faPencil" class="mr-2"></fa-icon> Edit title
                  </button>
                </li>
                <li>
                  <button
                    class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-600"
                    (click)="deleteList(list); list.showActions = false;"
                  >
                    <fa-icon [icon]="faTrash" class="mr-2"></fa-icon> Delete list
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>

      <!-- NOT HERE -> This is the parent of all the columns
      Here we will introduce a directive to move tasks between columns
      the directive is cdkDropListGroup-->
      <!-- NOT HERE -> overflow-x-scroll is to make the columns scrollable in the x-axis -->
      <!-- flex items-start is to make the columns start from the top -->
      <!-- NOT HERE -> w-max: This makes the columns expand naturally instead of forcing them to fit
        within the full width, which avoids unnecessary blank spaces. -->
      <!-- Here we will use grow to make the columns grow to the size of the parent -->
      <!-- This is the parent of all the columns -->


        <!-- Columnas -->
        <!-- Here we will create the columns for the tasks
        Each column will have a title and a list of tasks
        The list of tasks will be draggable and droppable
        The columns will be droppable-->
        <!-- shrink-0 is to make the column shrink to the size of its content -->
        <!-- In the parent element we need to use cdkDropListGroup directive
        cdkDropListDropped is an event and hence I need to create drop(event)
        [cdkDropListData] contains the data to sort the column again, in this case the data is the array
        called 'list.cards'-->
        <!-- NOT HERE: min-h-[2.5rem] is to leave a space for the user to drop the task -->
        <!-- Here we need to specify the list id to recover it as listId in our TS file -->
        <div
          class="text-sm mt-2 min-h-24"
          cdkDropList
          [id]="list.id.toString()"
          (cdkDropListDropped)="drop($event)"
          [cdkDropListData]="list.cards"
          [cdkDropListConnectedTo]="getConnectedListIds()"
        >
          <!-- Make columns draggable -->

          <!-- Cards -->
          <!-- Here we will use cdkDrag to make the tasks draggable
          cdkDrag is a directive-->
          <!-- Let's render here the list of tasks using a @for loop -->
          <!-- Over this div we will open the dialog -->
          <div
            (click)="openDialog(card, list)"
            *ngFor="let card of list?.cards"
            cdkDrag
            class="bg-white shadow-sm border-2 p-2 rounded-xl mt-2 border-x-gray-300 cursor-pointer hover:border-blue-600"
          >
            <!-- Here we will use cdkDrag to make the tasks draggable
            cdkDrag is a directive-->
            <!-- Let's render here the list of tasks using a @for loop -->
            <!-- Over this div we will open the dialog -->

            <!-- Show labels at the top of the card -->
            <!-- <div *ngIf="card.labels && card.labels.length > 0" class="flex flex-wrap gap-1 mb-2">
              <div *ngFor="let label of card.labels"
                class="h-2 w-10 rounded-sm"
                [ngClass]="label.color">
              </div>
            </div> -->

            <!-- Add custom preview element -->
            <div *cdkDragPreview class="bg-white shadow-md p-2 rounded-xl border-2 border-blue-500">
              {{ card.title }}
            </div>

            <!-- Add custom placeholder -->
            <div *cdkDragPlaceholder class="bg-gray-100 border-2 border-dashed p-2 rounded-xl opacity-50">
              {{ card.title }}
            </div>

            <!-- Card title -->
            <div>{{ card.title }}</div>

            <!-- Due date badge -->
            <!-- <div *ngIf="card.dueDate" class="mt-2 text-xs flex items-center">
              <fa-icon [icon]="faClock" class="mr-1" [ngClass]="{
                'text-green-600': card.completed,
                'text-red-600': !card.completed && new Date(card.dueDate) < new Date(),
                'text-gray-600': !card.completed && new Date(card.dueDate) >= new Date()
              }"></fa-icon>
              <span [ngClass]="{
                'line-through text-green-600': card.completed,
                'text-red-600': !card.completed && new Date(card.dueDate) < new Date(),
                'text-gray-600': !card.completed && new Date(card.dueDate) >= new Date()
              }">
                {{ card.dueDate | date:'shortDate' }}
              </span>
            </div> -->
          </div>

          <!-- Add card section -->
           <!-- Add card section with z-index to keep it visible -->
          <div class="flex justify-between align-center m-2">
            <div class="w-9/12 hover:bg-gray-300 rounded-xl">
              <button
              class="p-2 text-left text-sm font-semibold"
              (click)="addCard(list)"
              >
                <fa-icon [icon]="faPlus" class="pr-2"></fa-icon>Add a card
              </button>
              <!-- Open the dialog to add a card -->
              <div *ngIf="activeListId === list.id" class="mt-2 p-2">
                <!-- $event.preventDefault() is to prevent the default behavior of the enter key -->
                <textarea
                  class="w-full p-2 border rounded-xl border-blue-600 focus:outline-none resize-none"
                  rows="3"
                  placeholder="Enter a title for this card..."
                  [(ngModel)]="newCardTitle"
                  (keydown.enter)="$event.preventDefault(); confirmAddCard(list)"
                  #cardTextarea
                ></textarea>
                <div class="flex mt-2">
                  <app-btn
                    [colorBtn]="'success'"
                    [typeBtn]="'button'"
                    [disabled]="!newCardTitle.trim()"
                    [loading]="status === 'loading'"
                    (click)="confirmAddCard(list)"
                  >
                    Add card
                  </app-btn>
                  <button
                    class="ml-2 text-gray-500 hover:text-gray-700"
                    (click)="cancelAddCard()"
                  >
                    <fa-icon [icon]="faTimes"></fa-icon>
                  </button>
                </div>
              </div>
            </div>
            <div class="flex justify-center w-10 hover:bg-gray-300 rounded-xl pt-2 ">
              <fa-icon [icon]="faImage"></fa-icon>
            </div>
          </div>

          </div>
        </div>
        <!-- FIN Columnas-->
        <!-- This is the button to add a new list -->
        <!-- shrink-0 is to make the column shrink to the size of its content -->
        <div class="shrink-0">
          <button
          class="bg-white/30 hover:bg-white/50 w-72 text-white rounded-2xl p-4 text-base text-left"
          *ngIf="!showListForm"
          (click)="showListForm = !showListForm"
          (clickOutside)="showListForm = false"
          >
            <fa-icon [icon]="faPlus" class="pr-2"></fa-icon>Add other list
          </button>
          <!-- Open the dialog to add a list -->
          <div *ngIf="showListForm" class="bg-gray-200 rounded-2xl p-4 w-72">
            <!-- $event.preventDefault() is to prevent the default behavior of the enter key -->
            <textarea
              class="w-full p-2 border rounded-xl border-blue-600 focus:outline-none resize-none"
              rows="3"
              placeholder="Enter a title for this list.."
              [(ngModel)]="newListTitle"
              (keydown.enter)="$event.preventDefault(); addList()"
              #listTextarea
            ></textarea>
            <div class="flex mt-2">
              <app-btn
                [colorBtn]="'success'"
                [typeBtn]="'button'"
                [disabled]="!newListTitle.trim()"
                [loading]="status === 'loading'"
                (click)="addList()"
              >
                Add list
              </app-btn>
              <button
                class="ml-2 text-gray-500 hover:text-gray-700"
                (click)="showListForm = !showListForm"
              >
                <fa-icon [icon]="faTimes"></fa-icon>
              </button>
            </div>
          </div>
        </div>
    </div>
    <!-- FIN Contenido de las listas -->
  </div>
</div>
