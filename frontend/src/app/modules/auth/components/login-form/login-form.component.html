<!-- Form layout container -->
<!-- w-full keeps the backgound hidden-->
<!-- sm:w-7/12 md:w-6/12 lg:w-4/12 is for mobile design-->
<h1 class="font-bold text-blue-p text-base text-center pb-7">
  Login to Trello
</h1>
<form [formGroup]="form" (ngSubmit)="doLogin()" novalidate class="space-y-4">
  <div>
    <div class="relative">
      <input class="w-full bg-gray-50 rounded border-2 border-gray-300" #nameInput formControlName="email" type="email"
        placeholder="Enter your email" />
      <button type="button" class="text-gray-500 p-2 absolute right-2" (click)="nameInput.focus()">
        <fa-icon [icon]="faPen"></fa-icon>
      </button>
    </div>
    <div *ngIf="form.controls.email.touched && form.controls.email.invalid">
      <p *ngIf="form.controls.email.hasError('required')" class="font-medium text-red-500 text-xs mt-1 ml-1">
        This field is mandatory
      </p>
      <p *ngIf="form.controls.email.hasError('email')" class="font-medium text-red-500 text-xs mt-1 ml-1">
        This field is not an email.
      </p>
    </div>
  </div>
  <div>
    <div class="relative">
      <input class="w-full bg-gray-50 rounded border-2 border-gray-300" #nameInput formControlName="password"
        [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password" />
      <button type="button" class="text-gray-500 p-2 absolute right-2" (click)="showPassword = !showPassword">
        <fa-icon [icon]="showPassword ? faEye : faEyeSlash"></fa-icon>
      </button>
    </div>
    <div *ngIf="form.controls.password.touched && form.controls.password.invalid">
      <p *ngIf="form.controls.password.hasError('required')" class="font-medium text-red-500 text-xs mt-1 ml-1">
        This field is mandatory
      </p>
      <p *ngIf="form.controls.password.hasError('minlength')" class="font-medium text-red-500 text-xs mt-1 ml-1">
        This field must be greater than 8 characters.
      </p>
    </div>
  </div>
  <!-- This is an error mesagge in case the status is failed at the moment
  to make the login -->
  <div *ngIf="status === 'failed'">
    <p class="font-medium text-red-500 text-xs mt-1 ml-1">
      Your credentials are incorrect. Please try again.
    </p>
  </div>
  <div class="relative">
    <app-btn routerLink="/app/boards" [typeBtn]="'submit'" [colorBtn]="'success'" [loading]="status === 'loading'">
      Login
    </app-btn>
  </div>
</form>
